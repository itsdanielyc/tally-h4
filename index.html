<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; form-action 'none'; base-uri 'none'">
    <title>Tally</title>
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <aside class="sidebar" data-geo="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Tally</div>
      <nav aria-label="Ledger">
        <button type="button" data-screen="transactions" aria-current="page">Transactions</button>
        <button type="button" data-screen="import">Import CSV</button>
        <button type="button" data-screen="settings">Settings</button>
      </nav>
      <div class="local"><span class="local-dot" aria-hidden="true"></span><span>On this device</span></div>
      <span id="backend-badge" data-testid="backend-badge" hidden></span>
    </aside>
    <main id="workspace">
      <section id="view" aria-labelledby="screen-title"></section>
      <p id="notice" role="status" aria-atomic="true"></p>
      <p id="error" role="alert" aria-atomic="true"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

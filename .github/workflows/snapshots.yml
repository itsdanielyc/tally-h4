name: snapshots
on: workflow_dispatch
permissions:
  contents: read
jobs:
  apple-silicon-checkpoints:
    runs-on: macos-latest
    timeout-minutes: 24
    env:
      CI: "1"
      CHECKPOINTS: "7943a1d05ce5db2ffe2decadf82282420fd0cdae 653fc0b4db5196029987826f5d09aa36512c2ef2 fc14beee1c4a4f0f40b3148122418aa10dafe88b 44bcaba17c3000b0ffe87d2acbb4a7afcf0b8c2e 3311aae28d2c77262bc76c7cd10daae0bdd12e15"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node node_modules/electron/install.js
      - name: Verify each source checkpoint on Apple silicon
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          slice=0
          for commit in $CHECKPOINTS; do
            slice=$((slice+1))
            echo "::group::Slice $slice at $commit"
            git switch --detach "$commit"
            output="$RUNNER_TEMP/tally-checkpoints/slice-$slice"
            mkdir -p "$output"
            git rev-parse HEAD > "$output/commit.txt"
            npm run test:integration
            npm run test:ui -- --grep "tier 1|tier 2"
            npm run test:ui:update
            npm run test:ui
            cp tests/ui/__snapshots__/home.spec.ts/home-chromium-darwin.png "$output/"
            git restore --worktree -- tests/ui/__snapshots__
            npm run build
            npm run test:e2e
            cp artifacts/e2e/darwin-arm64.png "$output/"
            echo "Slice $slice passed L3–L6"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-silicon-checkpoints
          path: ${{ runner.temp }}/tally-checkpoints
          retention-days: 14
